name: ci
on: [push, pull_request]
jobs:
  vectors:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: "Linux GCC, default flags (run-time dispatch)", cflags: "" }
          - { os: ubuntu-latest,  name: "Linux GCC, -march=native",  cflags: "-march=native" }
          - { os: ubuntu-latest,  name: "Linux portable C",          cflags: "-DHASSH_PORTABLE" }
          - { os: ubuntu-24.04-arm, name: "Linux AArch64 + AES",     cflags: "-march=armv8-a+crypto" }
          - { os: macos-latest,   name: "macOS Apple silicon",       cflags: "" }
          - { os: windows-latest, name: "Windows MSVC, portable",    cflags: "" }
          - { os: windows-latest, name: "Windows MSVC, /arch:AVX2",  cflags: "/arch:AVX2" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_FLAGS=${{ matrix.cflags }}"
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
  full-suite:
    name: Linux full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: python3 ports/python/hassh64.py
  rust:
    name: Rust crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo test --release --no-default-features
  rust-msrv:
    name: Rust crate builds on its MSRV (1.72)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.72 --profile minimal
      # The library alone: dev-dependencies (criterion) need a newer Rust.
      - run: sed -i '/^\[dev-dependencies\]/,/^\[\[bench\]\]/d; /^name = "hash"/d; /^harness = false/d' Cargo.toml && rm -f Cargo.lock
      - run: cargo +1.72 build --lib
      - run: cargo +1.72 build --lib --no-default-features
  integrations:
    name: Integrations (kernel, C++, SQLite, PostgreSQL, Rust no_std kernel target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - run: make -C integrations/kernel check
      - run: make -C integrations/cpp test
      - run: make -C integrations/cpp test CXX=clang++
      - run: make -C integrations/sqlite test
      # PostgreSQL 18 in its official image: the same throwaway-cluster check as locally.
      - run: |
          docker run --rm --tmpfs /tmp:exec,size=2g -v "$PWD:/src:ro" postgres:18 bash -ec '
            apt-get update -qq && apt-get install -y -qq build-essential postgresql-server-dev-18 >/dev/null 2>&1
            mkdir -p /tmp/hassh && cp -r /src/integrations /src/hassh.h /tmp/hassh/ && chown -R postgres /tmp/hassh
            su postgres -c "/tmp/hassh/integrations/postgres/check.sh"'
      - run: rustup target add x86_64-unknown-none
      - run: cargo build --release --target x86_64-unknown-none --no-default-features
        working-directory: rust
