[package]
name = "hassh64"
version = "1.0.0"
edition = "2021"
rust-version = "1.72"
license = "MIT"
repository = "https://github.com/zsigisti/hassh64"
readme = "README.md"
description = "hassh64: a fast, seeded, non-cryptographic 64-bit hash (AES-NI / ARMv8 AES / portable, bit-identical everywhere). AI-generated by Anthropic's Claude; not human-reviewed."
keywords = ["hash", "hasher", "hashmap", "no_std", "aes"]
categories = ["algorithms", "no-std", "data-structures"]
include = ["src/**", "tests/**", "benches/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = ["std"]
# Run-time AES detection (x86_64 and aarch64) and `RandomState` / `HashMap`.
std = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
ahash = "0.8"
foldhash = "0.2"
rapidhash = "4"

[[bench]]
name = "hash"
harness = false

[profile.bench]
debug = false
